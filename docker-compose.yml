version: '3.8'
services:
  server:
    build: ./server
    ports:
      - "3001:3001"
    volumes:
      - ./server/chat.db:/app/chat.db
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/app/chat.db
  client:
    build: .
    ports:
      - "3000:80"
    environment:
      - REACT_APP_SOCKET_URL=http://server:3001
    depends_on:
      - server
